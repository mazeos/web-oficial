services:
  web-oficial:
    build: .
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - "traefik.http.routers.web-oficial-dev.rule=Host(`go-test.mazefunnels.io`)"
      - traefik.http.routers.web-oficial-dev.entrypoints=websecure
      - traefik.http.routers.web-oficial-dev.tls.certresolver=letsencrypt
      - traefik.http.services.web-oficial-dev.loadbalancer.server.port=80
networks:
  traefik-public:
    external: true
